# `make run` -> docker compose up --build, from track_2b/ (the project root).
# Works with NO API key set: the app serves clearly-labeled demo mode.
# With LLM_API_KEY set, it talks to the configured OpenAI-compatible Apertus endpoint.

services:
  app:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_NAME: ${LLM_NAME:-swiss-ai/Apertus-v1.5-70B}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PORT: 5000
    restart: unless-stopped
